<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Welcome to Our Community!</title>
    <style>
      /* Reset styles to ensure cross-client consistency */
      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
      table {
        border-collapse: collapse !important;
      }
      body {
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        background-color: #f4f6f8;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      /* Mobile responsive adjustments */
      @media screen and (max-width: 600px) {
        .email-container {
          width: 100% !important;
          max-width: 100% !important;
        }
        .fluid {
          max-width: 100% !important;
          height: auto !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        .stack-column {
          display: block !important;
          width: 100% !important;
          max-width: 100% !important;
          direction: ltr !important;
        }
        .padded-cell {
          padding: 20px !important;
        }
        .headline {
          font-size: 24px !important;
          line-height: 30px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f6f8">
    <!-- Presentation wrapper -->
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #f4f6f8"
    >
      <tr>
        <td align="center" style="padding: 40px 10px">
          <!-- Main Email Container (Standard 600px width) -->
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            class="email-container"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            "
          >
            <!-- HEADER / LOGO -->
            <tr>
              <td
                align="center"
                style="padding: 40px 20px 20px 20px; background-color: #ffffff"
              >
                <!-- Replace URL with your actual logo asset -->
                <img
                  src="https://i.ibb.co/CKbQ5C9x/logo.png"
                  alt="Company Logo"
                  width="100"
                  height="35"
                  style="
                    display: block;
                    font-family: Arial, sans-serif;
                    font-size: 16px;
                    color: #111111;
                    font-weight: bold;
                  "
                />
              </td>
            </tr>

            <!-- HERO IMAGE (Optional) -->
            <!-- <tr>
              <td align="center" style="background-color: #ffffff"> -->
            <!-- Replace URL with an engaging welcome graphic -->
            <!-- <img
                  src="https://placeholder.com!"
                  alt="Welcome Illustration"
                  width="600"
                  style="width: 100%; max-width: 600px; display: block"
                  class="fluid"
                />
              </td>
            </tr> -->

            <!-- MAIN BODY CONTENT -->
            <tr>
              <td
                class="padded-cell"
                style="
                  padding: 0px 50px 40px 50px;
                  background-color: #ffffff;
                  text-align: left;
                "
              >
                <h1
                  class="headline"
                  style="
                    margin: 0 0 20px 0;
                    font-family:
                      &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
                    font-size: 28px;
                    line-height: 34px;
                    font-weight: 700;
                    text-align: center;
                    color: #1a1a1a;
                  "
                >
                  Verify your email
                </h1>
                <p
                  style="
                    margin: 0 0 20px 0;
                    font-family:
                      &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
                    font-size: 16px;
                    line-height: 24px;
                    color: #555555;
                  "
                >
                  Hey [First Name],
                </p>
                <p
                  style="
                    margin: 0 0 30px 0;
                    font-family:
                      &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
                    font-size: 16px;
                    line-height: 24px;
                    color: #555555;
                  "
                >
                  Welcome to Wallflower Beauty, please verify your email address
                  to complete your registartion.
                </p>
              </td>
            </tr>

            <!-- THREE QUICK STEPS FEATURE SECTION -->
            <tr>
              <td
                class="padded-cell"
                style="
                  padding: 30px 50px;
                  background-color: #f8fafc;
                  border-top: 1px solid #e2e8f0;
                  border-bottom: 1px solid #e2e8f0;
                "
              >
                <h3
                  style="
                    margin: 0 0 20px 0;
                    font-family:
                      &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
                    font-size: 16px;
                    font-weight: 700;
                    color: #475569;
                    text-align: center;
                    text-transform: uppercase;
                    letter-spacing: 1px;
                  "
                >
                  Your verification code
                </h3>

                <!-- Step 2 -->
                <table
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  width="100%"
                  style="margin-bottom: 15px"
                >
                  <tr>
                    <td
                      valign="top"
                      style="
                        font-family: Arial, sans-serif;
                        font-size: 42px;
                        line-height: 22px;
                        color: #da4b83;
                        text-align: center;
                        letter-spacing: 10px;
                      "
                    >
                      [706789]
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- FOOTER -->
            <tr>
              <td
                class="padded-cell"
                style="
                  padding: 40px 50px;
                  background-color: #ffffff;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0 0 15px 0;
                    font-family:
                      &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
                    font-size: 14px;
                    line-height: 20px;
                    color: #64748b;
                  "
                >
                  This code will expire in <strong>10 minutes</strong> so be
                  sure to use it soon.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
